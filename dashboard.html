<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <h1>User Dashboard</h1>
    <h2>Quiz History</h2>
    <table>
        <thead>
            <tr>
                <th>Quiz Title</th>
                <th>Date Taken</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <!-- Quiz history will be populated here -->
            <tr>
                <td>Sample Quiz 1</td>
                <td>2023-02-20</td>
                <td>85%</td>
            </tr>
            <tr>
                <td>Sample Quiz 2</td>
                <td>2023-02-21</td>
                <td>90%</td>
            </tr>
        </tbody>
    </table>
    <h2>Statistics</h2>
    <p>Total Quizzes Taken: 2</p>
    <p>Average Score: 87.5%</p>
</body>
</html>

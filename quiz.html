<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .quiz-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            height: 20px;
            background: #4caf50;
            width: 0;
            transition: width 0.3s;
        }
        .progress-container {
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Interactive Quiz</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div id="question-container">
            <div id="question">Question goes here...</div>
            <button class="answer-btn">Answer 1</button>
            <button class="answer-btn">Answer 2</button>
            <button class="answer-btn">Answer 3</button>
            <button class="answer-btn">Answer 4</button>
        </div>
    </div>
    <script>
        let questionIndex = 0;
        const questions = [
            { question: 'What is 2 + 2?', answers: ['3', '4', '5', '6'], correct: 1 },
            { question: 'What is the capital of France?', answers: ['Berlin', 'Madrid', 'Paris', 'Lisbon'], correct: 2 }
        ];

        function showQuestion() {
            const currentQuestion = questions[questionIndex];
            document.getElementById('question').innerText = currentQuestion.question;
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, index) => {
                btn.innerText = currentQuestion.answers[index];
                btn.onclick = () => selectAnswer(index);
            });
        }

        function selectAnswer(index) {
            if (index === questions[questionIndex].correct) {
                alert('Correct!');
            } else {
                alert('Wrong answer!');
            }
            questionIndex++;
            if (questionIndex < questions.length) {
                updateProgressBar();
                showQuestion();
            } else {
                alert('Quiz finished!');
            }
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = ((questionIndex + 1) / questions.length) * 100 + '%';
        }

        showQuestion();
    </script>
</body>
</html>
